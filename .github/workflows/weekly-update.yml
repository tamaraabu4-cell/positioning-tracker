name: Weekly positioning update

on:
  schedule:
    - cron: "17 7 * * 6"   # Saturday 07:17 UTC, the morning after Friday's report
    - cron: "17 7 * * 2"   # Tuesday 07:17 UTC, catches reports delayed by US holidays
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add positioning.json history.csv
          git diff --staged --quiet || git commit -m "Weekly update: CFTC report $(date -u +%Y-%m-%d)"
          git push